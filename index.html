<!DOCTYPE html>
<html lang="en" data-app="neck">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fretboard Visualiser</title>
<style>
  :root {
    --bg:#faf7f2; --ink:#1d1b19; --mute:#7a746b; --card:#fff; --line:#e4ddd0; --accent:#8a4b1f; --chip:#f1ebe1;
    --board:#efe7d6; --wire:#c3b79c; --string:#8a8578; --win:rgba(138,75,31,.10);
    --dot:#8a4b1f; --dotink:#fff; --acc:#1f6fd0; --pale:#ecdcc8; --paleline:#b98a62; --accpale:#d3e3f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#181614; --ink:#f0ebe3; --mute:#9c958a; --card:#23201d; --line:#3a352f; --accent:#e0a064; --chip:#2e2a26;
      --board:#2f2a24; --wire:#5a5146; --string:#9c958a; --win:rgba(224,160,100,.14);
      --dot:#e0a064; --dotink:#181614; --acc:#6fb3ff; --pale:#45382b; --paleline:#a77a4e; --accpale:#243a52;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:14px 12px 40px; }
  h1 { font-size:21px; margin:0 0 10px; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; }
  .pill { border:1.5px solid var(--line); background:var(--card); border-radius:20px; padding:5px 12px; font-weight:600; font-size:15px; }
  .pill.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  #keys .pill { min-width:48px; padding:5px 6px; }
  .grp { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .grp > span { color:var(--mute); font-size:14px; margin-right:2px; }
  .fb { display:block; width:100%; height:auto; touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:grab; margin-top:4px; }
  .fb.drag { cursor:grabbing; }
  .fb .board { fill:var(--board); }
  .fb .band { fill:var(--win); transition:x .15s, width .15s; }
  .fb .wire { stroke:var(--wire); stroke-width:2; }
  .fb .nut { stroke:var(--string); stroke-width:5; }
  .fb .str { stroke:var(--string); }
  .fb .inlay { fill:var(--wire); opacity:.7; }
  .fb .num { fill:var(--mute); font-size:15px; font-weight:600; text-anchor:middle; }
  .fb .dot { transform-box:fill-box; transform-origin:center; transition:opacity .15s, transform .15s; cursor:pointer; }
  .fb .dot circle { fill:var(--dot); }
  .fb .dot text { fill:var(--dotink); font-size:16px; font-weight:700; text-anchor:middle; dominant-baseline:central; pointer-events:none; letter-spacing:-.3px; }
  .fb .dot.accent circle { fill:var(--acc); }
  .fb .dot.root circle { fill:var(--ink); } .fb .dot.root text { fill:var(--bg); }
  .fb .dot circle { transition:fill .15s, stroke .15s; }
  .fb .dot.faded { transform:scale(.8); }
  .fb .dot.faded circle { fill:var(--pale); stroke:var(--paleline); stroke-width:2.5; }
  .fb .dot.faded text { fill:var(--ink); }
  .fb .dot.faded.accent circle { fill:var(--accpale); stroke:var(--acc); }
  .fb .dot.faded.root circle { fill:var(--pale); stroke:var(--ink); stroke-width:4.5; }
  .fb .dot.full  { opacity:.9; transform:scale(.7); }
  .fb .dot.hidden { opacity:0; transform:scale(.4); pointer-events:none; }
  #modes .chip { border:1.5px solid var(--line); background:var(--card); border-radius:10px; padding:4px 9px; font-size:14px; font-weight:600; }
  #modes .chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  #modes .row { margin-bottom:6px; }
  .modeline { text-align:center; font-weight:600; margin:6px 0 0; }
  [hidden] { display:none !important; }
  .strip { display:flex; justify-content:center; align-items:center; gap:6px; margin:10px 0 14px; flex-wrap:wrap; }
  .strip .chip { border:1.5px solid var(--line); background:var(--card); border-radius:10px; min-width:40px; padding:5px 8px; font-weight:700; }
  .strip .chip.on { background:var(--dot); color:var(--dotink); border-color:var(--dot); }
  .strip .arrow { border:1.5px solid var(--line); background:var(--card); border-radius:20px; padding:5px 14px; font-weight:700; }
  .opts { display:flex; flex-wrap:wrap; gap:8px 24px; justify-content:center; }
  @media (max-width:600px) { .pill { padding:5px 10px; font-size:14px; } #modes .chip { padding:3px 7px; font-size:13px; } h1 { font-size:18px; } .strip { gap:4px; } .strip .chip { min-width:34px; padding:5px 6px; } .strip .arrow { padding:5px 10px; } }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
<meta name="theme-color" content="#141A17" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E9F0E6" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="evening.css">
</head>
<body>
<div class="wrap">
  <p class="ma-brand"><svg viewBox="-12 -12 779 339" aria-hidden="true"><polyline points="0,158 85,158 159,315 159,0 292,315 425,0 425,315 559,0 693,315 533,158 755,158" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></svg>Matthew Annable</p>
  <h1 id="title"></h1>
  <div class="row" id="keys" role="group" aria-label="Key"></div>
  <div class="row" id="scales" role="group" aria-label="Scale"></div>
  <div id="modes" hidden>
    <div class="row" id="modeChips"></div>
    <div class="row" id="viewSwitch"></div>
  </div>
  <svg class="fb" id="board" role="img" aria-label="Guitar fretboard. Drag sideways to move between shapes."></svg>
  <div class="modeline" id="modeline" hidden></div>
  <div class="strip" id="strip"></div>
  <div class="opts">
    <div class="grp" id="labels"><span>Dots:</span></div>
    <div class="grp" id="neck"><span>Neck:</span></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
